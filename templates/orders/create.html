{% extends "base.html" %}

{% block title %}Create Order{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h2 class="mb-0">Create New Order</h2>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('main.create_order') }}">
                    <div class="mb-3">
                        <label for="customer_id" class="form-label">Customer *</label>
                        <select class="form-select" id="customer_id" name="customer_id" required>
                            <option value="">Select a customer...</option>
                            {% for customer in customers %}
                            <option value="{{ customer.id }}">{{ customer.name }} ({{ customer.email }})</option>
                            {% endfor %}
                        </select>
                        {% if customers|length == 0 %}
                        <div class="form-text text-danger">
                            No customers available. <a href="{{ url_for('main.create_customer') }}">Create a customer first</a>.
                        </div>
                        {% endif %}
                    </div>

                    <div class="mb-3">
                        <label for="total" class="form-label">Total Amount (€) *</label>
                        <input type="number" step="0.01" min="0" class="form-control" id="total" 
                               name="total" placeholder="0.00" required>
                    </div>

                    <div class="mb-3">
                        <label for="status" class="form-label">Status *</label>
                        <select class="form-select" id="status" name="status" required>
                            <option value="pending">Pending</option>
                            <option value="in_progress">In Progress</option>
                            <option value="completed">Completed</option>
                            <option value="cancelled">Cancelled</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" 
                                  rows="4" placeholder="Order details..."></textarea>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary" {% if customers|length == 0 %}disabled{% endif %}>
                            <i class="bi bi-check-circle"></i> Create Order
                        </button>
                        <a href="{{ url_for('main.list_orders') }}" class="btn btn-secondary">
                            <i class="bi bi-x-circle"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
