{% extends "base.html" %}

{% block title %}Neues Projekt{% endblock %}

{% block content %}
<h1><i class="fas fa-plus-circle me-2"></i>Neues Projekt erstellen</h1>

<div class="card mt-4">
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="project_name" class="form-label">Projektname *</label>
                    <input type="text" class="form-control" id="project_name" name="project_name" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="customer_id" class="form-label">Kunde</label>
                    <select class="form-select" id="customer_id" name="customer_id">
                        <option value="">Kunde auswählen</option>
                        {% for customer in customers %}
                        <option value="{{ customer.id }}">{{ customer.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Beschreibung</label>
                <textarea class="form-control" id="description" name="description" rows="3"></textarea>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="status" class="form-label">Status</label>
                    <select class="form-select" id="status" name="status">
                        <option value="geplant" selected>Geplant</option>
                        <option value="aktiv">Aktiv</option>
                        <option value="pausiert">Pausiert</option>
                        <option value="abgeschlossen">Abgeschlossen</option>
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="progress" class="form-label">Fortschritt (%)</label>
                    <input type="number" class="form-control" id="progress" name="progress" min="0" max="100" value="0">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="start_date" class="form-label">Startdatum</label>
                    <input type="date" class="form-control" id="start_date" name="start_date">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="end_date" class="form-label">Enddatum</label>
                    <input type="date" class="form-control" id="end_date" name="end_date">
                </div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save me-1"></i>Projekt erstellen
                </button>
                <a href="{{ url_for('main.list_projects') }}" class="btn btn-secondary">
                    <i class="fas fa-times me-1"></i>Abbrechen
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
